<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Study Buddy Cat</title>
<meta name="author" content="Peter">
<meta name="description" content="A cat named Mochi. She follows your mouse and gets a treat when you check off a task.">
<style>
  body { margin: 0; height: 100vh; overflow: hidden; font-family: sans-serif; background: #f6efe6;
         display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  #room { position: relative; width: 460px; height: 320px; background: #fbeedd; border: 3px solid #2d2a32; border-radius: 14px; overflow: hidden;
          box-shadow: 0 6px 0 #2d2a32; background-image: linear-gradient(90deg, rgba(0,0,0,0.03) 50%, transparent 50%); background-size: 40px 40px; }
  #window { position: absolute; top: 70px; left: 30px; width: 110px; height: 90px; border: 4px solid #fff; border-radius: 6px;
            background: linear-gradient(#9fd3f2, #d9f0fb); box-shadow: 0 0 0 3px #c9b8a6; }
  #window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 3px solid #fff; }
  .prop { position: absolute; bottom: 56px; font-size: 34px; }
  #desk { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #a47551; border-top: 3px solid #2d2a32; }
  #cat { position: absolute; bottom: 52px; left: 170px; font-size: 64px; transition: left 0.3s, bottom 0.3s; }
  #cat.sleep { animation: breathe 3s ease-in-out infinite; }
  #cat.happy { animation: hop 0.4s ease-out 3; }
  @keyframes breathe { 50% { transform: scale(1.05, 0.95); } }
  @keyframes hop { 50% { transform: translateY(-30px); } }
  #zzz { position: absolute; bottom: 120px; left: 230px; font-size: 22px; color: #888; }
  #yarn { position: absolute; font-size: 28px; display: none; left: 300px; top: 180px; }
  #bubble { position: absolute; top: 14px; left: 14px; right: 14px; background: #fff; border: 1px solid #c9b8a6;
            padding: 8px; font-size: 14px; min-height: 18px; }
  #cat, #yarn, #zzz { pointer-events: none; }
  #note { position: absolute; top: 62px; left: 270px; width: 160px; background: #fff59d; padding: 8px 10px; font-size: 13px;
          transform: rotate(2deg); box-shadow: 2px 3px 0 rgba(0,0,0,0.15); font-family: "Comic Sans MS", "Chalkboard SE", cursive; }
  #note div { cursor: pointer; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stage { position: relative; }
  #room { transform-origin: 0 0; }
  #note div:hover { text-decoration: line-through; }
  #new { margin-top: 10px; font: inherit; font-size: 14px; padding: 5px 8px; width: 260px; border: 2px solid #2d2a32; border-radius: 8px; }
  #info { margin-top: 8px; font-size: 13px; color: #6b5a4a; }
</style>
</head>
<body>
<div id="stage"><div id="room">
  <div id="bubble">Move your mouse to play with Mochi.</div>
  <div id="window"></div>
  <div id="note"></div>
  <div id="desk"></div>
  <div class="prop" style="left: 380px">🪴</div>
  <div class="prop" style="left: 330px; font-size: 28px">📚</div>
  <div id="cat">🐈</div>
  <div id="zzz"></div>
  <div id="yarn">🧶</div>
</div></div>
<input id="new" placeholder="write a task on the note">
<div id="info"></div>

<script>
const cat = document.getElementById("cat")
const yarn = document.getElementById("yarn")
const room = document.getElementById("room")

let save = { treats: 0, name: "Mochi" }
let openCount = null // how many open tasks there were last time, to notice new ones
let idle = null
let scale = 1

// the room is drawn at 460x320 and scaled up to fill the frame
function fit() {
  scale = Math.max(0.5, Math.min((window.innerWidth - 20) / 466, (window.innerHeight - 110) / 326, 2))
  room.style.transform = "scale(" + scale + ")"
  const stage = document.getElementById("stage")
  stage.style.width = 466 * scale + "px"
  stage.style.height = 326 * scale + "px"
}
fit()
window.addEventListener("resize", fit)

function say(text) { document.getElementById("bubble").textContent = text }

function info() {
  document.getElementById("info").textContent = save.name + " has had " + save.treats + " treat" + (save.treats === 1 ? "" : "s")
}

// falls asleep after 20s of nothing
function wake() {
  cat.className = ""
  document.getElementById("zzz").textContent = ""
  clearTimeout(idle)
  idle = setTimeout(() => {
    cat.className = "sleep"
    cat.style.bottom = "52px"
    yarn.style.display = "none"
    document.getElementById("zzz").textContent = "z z z"
    say(save.name + " fell asleep.")
  }, 20000)
}

room.addEventListener("mousemove", (e) => {
  wake()
  const box = room.getBoundingClientRect()
  const x = (e.clientX - box.left) / scale
  const y = (e.clientY - box.top) / scale
  yarn.style.display = "block"
  yarn.style.left = x - 14 + "px"
  yarn.style.top = y - 14 + "px"
  cat.style.left = Math.max(0, Math.min(390, x - 32)) + "px"
  cat.style.bottom = Math.max(52, Math.min(220, 320 - y - 32)) + "px"
})

function celebrate(text) {
  wake()
  say(text)
  cat.className = "happy"
  setTimeout(() => { cat.className = "" }, 1300)
}

// only room for 5 on the note
function drawNote(tasks) {
  const note = document.getElementById("note")
  note.innerHTML = ""
  const open = tasks.filter((t) => !t.done)
  if (!open.length) note.textContent = "nothing left"
  for (const t of open.slice(0, 5)) {
    const line = document.createElement("div")
    line.textContent = "☐ " + t.text
    line.title = t.text
    line.onclick = () => parent.postMessage({ type: "update", id: t.id, done: true }, "*")
    note.appendChild(line)
  }
  if (open.length > 5) note.append("+" + (open.length - 5) + " more")
}

document.getElementById("new").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return
  parent.postMessage({ type: "add", text: e.target.value }, "*")
  e.target.value = ""
})

// tasks that are done now but weren't last time
function newlyDone(tasks) {
  const seen = save.seen || []
  const fresh = tasks.filter((t) => t.done && !seen.includes(t.id))
  save.seen = tasks.filter((t) => t.done).map((t) => t.id)
  return fresh
}

window.addEventListener("message", (e) => {
  const msg = e.data
  if (msg.type === "load" && msg.save) save = { ...save, ...msg.save }

  if (msg.type === "tasks") {
    drawNote(msg.tasks)
    const fresh = newlyDone(msg.tasks)
    const open = msg.tasks.filter((t) => !t.done).length
    if (fresh.length) {
      save.treats += fresh.length
      celebrate(save.name + " got a treat for \"" + fresh[0].text + "\" 🐟")
    } else if (openCount !== null && open > openCount) {
      say(save.name + " noticed a new task.")
    }
    openCount = open
    parent.postMessage({ type: "save", save }, "*")
  }
  info()
})

wake()
info()
parent.postMessage({ type: "hello" }, "*")
</script>
</body>
</html>
