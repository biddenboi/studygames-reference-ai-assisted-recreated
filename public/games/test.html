<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; }
</style>
</head>
<body>
  <h2>Test app</h2>
  <p>Reload the page, the count should stay.</p>
  <button id="btn">Clicked 0 times</button>
  <h3>Your tasks</h3>
  <ul id="list"></ul>
  <input id="new" placeholder="add a task from the app">
<script>
let clicks = 0
const btn = document.getElementById("btn")

function show() {
  btn.textContent = "Clicked " + clicks + " times"
}

btn.onclick = () => {
  clicks++
  show()
  parent.postMessage({ type: "save", save: { clicks } }, "*")
}

window.addEventListener("message", (e) => {
  const msg = e.data || {}
  if (msg.type === "load" && msg.save) {
    clicks = msg.save.clicks
    show()
  }
  if (msg.type === "tasks") {
    const list = document.getElementById("list")
    list.innerHTML = ""
    for (const t of msg.tasks) {
      const li = document.createElement("li")
      li.textContent = (t.done ? "[x] " : "[ ] ") + t.text
      // clicking a task flips it, to test update
      li.onclick = () => parent.postMessage({ type: "update", id: t.id, done: !t.done }, "*")
      list.append(li)
    }
  }
})

document.getElementById("new").onkeydown = (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return
  parent.postMessage({ type: "add", text: e.target.value }, "*")
  e.target.value = ""
}

parent.postMessage({ type: "hello" }, "*")
</script>
</body>
</html>
