<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 20px; }
</style>
</head>
<body>
  <h2>Test app</h2>
  <p>Reload the page, the count should stay.</p>
  <button id="btn">Clicked 0 times</button>
<script>
let clicks = 0
const btn = document.getElementById("btn")

function show() {
  btn.textContent = "Clicked " + clicks + " times"
}

btn.onclick = () => {
  clicks++
  show()
  parent.postMessage({ type: "save", save: { clicks } }, "*")
}

window.addEventListener("message", (e) => {
  const msg = e.data || {}
  if (msg.type === "load" && msg.save) {
    clicks = msg.save.clicks
    show()
  }
})

parent.postMessage({ type: "hello" }, "*")
</script>
</body>
</html>
